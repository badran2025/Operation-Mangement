<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A — Ledger · Kleen Ops</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="base.css">
<style>
:root{
  --font-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif; --font-head:var(--font-body);
  --canvas:#ffffff; --surface:#ffffff; --side-bg:#f6f7f9; --top-bg:rgba(255,255,255,.85); --field:#ffffff;
  --ink:#15191f; --muted:#5b6270; --hairline:#e3e6ea; --hover:#eef0f3; --selected:#e8f1fa; --selected-ink:#0f5f99;
  --primary:#15191f; --primary-hover:#2a313b; --on-primary:#fff; --link:#1f6fb0; --focus:#1f7fc0;
  --brand:#1f8bd0; --brand-2:#ffc531;
  --late-bg:#fff4cf; --late-ink:#8a5a00; --warn-bg:#fff4cf; --warn-ink:#8a5a00;
  --info-bg:#e8f1fa; --info-ink:#0f5f99; --prog-bg:#eef0f3; --prog-ink:#323944; --chip:#eef0f3; --chip-ink:#323944;
  --r-sm:4px; --r-md:6px; --r-btn:6px; --side-w:232px; --fs-h1:26px; --fw-h1:600;
}
html[data-theme="dark"]{
  --canvas:#101317; --surface:#161a20; --side-bg:#0c0f12; --top-bg:rgba(16,19,23,.85); --field:#161a20;
  --ink:#e9ecf0; --muted:#9aa3b0; --hairline:#262c35; --hover:#1c2128; --selected:#16304a; --selected-ink:#9fd0f5;
  --primary:#e9ecf0; --primary-hover:#ffffff; --on-primary:#101317; --link:#7cc0f2; --focus:#5aaeea;
  --late-bg:#3a2e0b; --late-ink:#ffd666; --warn-bg:#3a2e0b; --warn-ink:#ffd666;
  --info-bg:#16304a; --info-ink:#9fd0f5; --prog-bg:#222832; --prog-ink:#c9d0da; --chip:#222832; --chip-ink:#c9d0da;
}
/* KPIs: one hairline-divided strip, no cards */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-block:1px solid var(--hairline)}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px;border-inline-start:1px solid var(--hairline)}
.kpi:first-child{border-inline-start:0;padding-inline-start:0}
.kpi-label{font-size:13px;color:var(--muted)}
.kpi-value{font-size:30px;font-weight:600;line-height:1.1}
.kpi-late .kpi-value{color:var(--late-ink)}
.kpi-late{box-shadow:inset 0 3px 0 var(--brand-2)}
.kpi-warn .kpi-value{color:var(--warn-ink)}
/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface)}
.tbl{inline-size:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 14px;text-align:start;border-block-end:1px solid var(--hairline);vertical-align:middle}
.tbl thead th{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--side-bg);position:sticky;top:0}
.tbl .n{text-align:end}
.tbl tr.group th{background:var(--canvas);font-weight:600;padding-block:12px 8px}
.tbl tr.group span{font-weight:400;color:var(--muted);margin-inline-start:8px;font-size:13px}
.tbl tbody tr:not(.group):hover{background:var(--hover)}
.tbl tr.has-late td:first-child{box-shadow:inset 3px 0 0 var(--brand-2)}
[dir="rtl"] .tbl tr.has-late td:first-child{box-shadow:inset -3px 0 0 var(--brand-2)}
.late-chip{display:inline-block;min-inline-size:26px;text-align:center;padding:0 6px;border-radius:4px;background:var(--late-bg);color:var(--late-ink);font-weight:600}
.tbl-tickets td:nth-child(2){max-inline-size:0;inline-size:60%}
.tbl-tickets td:last-child,.tbl-tickets td:nth-child(3){white-space:nowrap}
.docs .doc-list{border:1px solid var(--hairline);border-radius:var(--r-md);padding-inline:14px;background:var(--surface)}
@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-inline-start:0;padding-inline:0;border-block-end:1px solid var(--hairline)}
  .kpi:nth-child(even){padding-inline-start:14px;border-inline-start:1px solid var(--hairline)}
  .kpi-docs,.kpi:last-child{grid-column:1/-1;border-block-end:0;padding-inline-start:0;border-inline-start:0}
}
</style>
</head>
<body data-variant="ledger"><script src="app.js"></script></body>
</html>
