<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B — Control Room · Kleen Ops</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="base.css">
<style>
:root{
  --font-body:"Readex Pro",system-ui,sans-serif; --font-head:var(--font-body);
  --canvas:#f7f8fa; --surface:#ffffff; --surface-2:#f1f3f6; --side-bg:#f1f3f6; --top-bg:rgba(247,248,250,.85); --field:#ffffff;
  --ink:#14181f; --muted:#5f6878; --hairline:#e2e5ea; --hover:#eaedf1; --selected:#e3effa; --selected-ink:#0e66a8;
  --primary:#1f7fc0; --primary-hover:#176aa3; --on-primary:#fff; --link:#1f7fc0; --focus:#1f7fc0;
  --brand:#1f8bd0; --brand-2:#ffc531;
  --late-bg:#fde8e8; --late-ink:#b42318; --warn-bg:#fff3d6; --warn-ink:#8a5a00;
  --info-bg:#e3effa; --info-ink:#0e66a8; --prog-bg:#efe9fb; --prog-ink:#5b3fb0; --chip:#eaedf1; --chip-ink:#3a414d;
  --r-sm:6px; --r-md:8px; --r-btn:8px; --side-w:220px; --fs-h1:24px; --fw-h1:500; --fs-body:14.5px;
}
html[data-theme="dark"]{
  --canvas:#0e1116; --surface:#141820; --surface-2:#1a1f28; --side-bg:#0b0d11; --top-bg:rgba(14,17,22,.85); --field:#141820;
  --ink:#e8ebf0; --muted:#9aa3b2; --hairline:#262c38; --hover:#1a1f28; --selected:#162b40; --selected-ink:#8cc8f5;
  --primary:#3a9be0; --primary-hover:#58aee9; --on-primary:#081018; --link:#6cb6ec; --focus:#58aee9;
  --late-bg:#3b1517; --late-ink:#ff8a80; --warn-bg:#3a2e0b; --warn-ink:#ffd666;
  --info-bg:#162b40; --info-ink:#8cc8f5; --prog-bg:#261f40; --prog-ink:#c4b5fd; --chip:#212733; --chip-ink:#c9d0da;
}
/* KPIs: compact tiles on the surface ladder */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--hairline);border:1px solid var(--hairline);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi-label{font-size:12.5px;color:var(--muted)}
.kpi-value{font-size:26px;font-weight:500;line-height:1}
.kpi-late{background:linear-gradient(var(--late-bg),var(--late-bg)) top/100% 2px no-repeat,var(--surface)}
.kpi-late .kpi-value{color:var(--late-ink)}
.kpi-warn .kpi-value{color:var(--warn-ink)}
.block{background:var(--surface);border:1px solid var(--hairline);border-radius:10px;padding:14px 16px}
.seg{display:flex;gap:2px;padding:2px;background:var(--surface-2);border-radius:8px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 52px 34px;gap:14px;align-items:center;padding:9px 6px;border-block-end:1px solid var(--hairline);border-radius:6px}
.row:hover{background:var(--hover)}
.row:last-child{border:0}
.row-name{font-weight:500}
.row-name small{display:inline;margin-inline-start:8px}
.bar{display:block;block-size:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;block-size:100%;background:var(--primary);border-radius:inherit}
.row-w{text-align:end}
.row-w small{display:inline;font-size:12px}
.dot-count{justify-self:end;min-inline-size:26px;block-size:22px;display:grid;place-items:center;border-radius:6px;font-size:12.5px;font-weight:600;background:var(--chip);color:var(--chip-ink)}
.dot-count.is-late{background:var(--late-bg);color:var(--late-ink)}
.inbox-list{list-style:none;margin:0;padding:0}
.inbox{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 6px;border-block-end:1px solid var(--hairline);border-radius:6px}
.inbox:hover{background:var(--hover)}
.inbox:last-child{border:0}
.dot{inline-size:8px;block-size:8px;border-radius:99px;background:var(--muted)}
.dot.status-assigned{background:var(--info-ink)} .dot.status-in_progress{background:var(--prog-ink)} .dot.status-waiting_parts{background:var(--warn-ink)}
.ib-main{min-inline-size:0}
.ib-side{font-size:12.5px;color:var(--muted);white-space:nowrap}
.doc-list li{padding-inline:6px}
@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:last-child{grid-column:1/-1}
  .row{grid-template-columns:minmax(0,1fr) 56px 30px}
  .row .bar{display:none}
  .row-name small{display:block;margin:0}
  .block-head .seg{inline-size:100%;overflow-x:auto}
}
</style>
</head>
<body data-variant="console"><script>if(!new URLSearchParams(location.search).get("theme")&&!matchMedia("(prefers-color-scheme: light)").matches){history.replaceState(null,"","?theme=dark")}</script><script src="app.js"></script></body>
</html>
